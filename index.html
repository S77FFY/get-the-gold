  }
  cv.addEventListener("pointerdown",e=>{const r=cv.getBoundingClientRect();tapAt((e.clientX-r.left)/r.width*COLS);});
  bb.addEventListener("click",()=>tapAt(null));
  if($("#skip"))$("#skip").onclick=()=>{if(finished)return;brk=null;paused=null;
    while(shown<days.length){produce(shown,false);shown++;if((ranDay&&shown>=ranDay)||(siltDay&&shown>=siltDay))break;}finish();};
  tutShow("run");
  if(fail)pause("end",{txt:fail+" Tap to see what went wrong."});
  else post({txt:"Fire it up!",mood:"grin",hold:1},true);
  loop(()=>{
    const now=performance.now(),dt=Math.min(0.1,(now-last)/1000);last=now;realT+=dt;
    if(brk&&brk.fixing&&realT-brk.fixing>FIXT){const quick=realT-brk.t0<=GRACE+FIXT;brk=null;fixes++;SND.fixed();
      post({txt:quick?"Fixed! Quick work.":"Fixed! That cost us.",mood:quick?"wow":"worry",hold:1},true);}
    const down=!!brk&&realT-brk.t0>GRACE;  // crew can limp along for a moment, then the plant stops
    if(brk&&down&&!brk.warned){brk.warned=true;SND.alarm(true);
      if(!brk.fixing)show({txt:"We're losing gold! Tap the "+NM[brk.who]+"!",bad:true,tap:true,mood:"worry",sticky:true});}
    const hold=!brk&&(q.length>0||(cur&&cur.hold&&realT-cur.at<1.8));
    if(!paused&&!fail&&!hold)simT+=dt;
    const dn=Math.min(days.length,Math.floor(simT*1000/dayMs));
    while(!paused&&!finished&&shown<dn&&!(!brk&&(q.length>0||(cur&&cur.hold&&realT-cur.at<1.8)))){const i=shown,d=days[i];
      const isDown=!!brk&&realT-brk.t0>GRACE;lastY=produce(i,isDown);shown++;
      if(ranDay&&shown===ranDay){pause("end",{txt:"Cut's dug out on day "+ranDay+"! Tap to wrap up the season."});break;}
      if(siltDay&&shown===siltDay){pause("end",{txt:"Ponds are full of silt on day "+siltDay+"! Tap to wrap up."});break;}
      const st=C.s.filter(v=>oz>=v-1e-6).length;
      if(st>passed){passed=st;post({txt:["","That's the target! One star!","Two stars! Keep going!","THREE STARS! Motherlode!"][st],mood:"wow",hold:1});}
      if(d.ev&&!brk){const frac=R.cs.P?Math.min(1,done/R.cs.P):0;
        if(d.ev.k==="brk"&&hasFM){post({txt:"Breakdown \u2014 the foreman had it sorted.",bad:true,mood:"worry",hold:1});}
        else if(d.ev.k==="brk"&&fixes<3&&shown-lastFix>=Math.max(6,R.days*0.2)){breakDown(d.ev.who,frac);break;}
        else if(d.ev.k==="brk")post({txt:"Another breakdown — the crew sorted it.",bad:true,mood:"worry",hold:1});
        else if(d.ev.k==="rain")post({txt:"Rain day. Pit's flooding!",bad:true,mood:"worry",hold:1});
        else post({txt:"Rich streak! Look at that!",mood:"wow"});}
      else if(!brk&&shown%9===0&&!q.length)post({txt:["Keep her running!","Gold's coming in!","That's the stuff!"][shown%3],mood:"grin"});}
    pump();
    pops=pops.filter(p=>p.hold?!!brk:realT-p.t0<1.1);
    const dc=$("#dc");if(!dc)return;dc.textContent=shown;$("#oz").textContent=fmt(fail?0:oz);
    $("#dchip").classList.toggle("hot",down);
    lostEl.innerHTML=lostDays?`${ICON.sun}<b>${lostDays}</b> day${lostDays>1?"s":""} lost to breakdowns`:"";lostEl.classList.toggle("on",!!lostDays);
    $("#bf").style.width=Math.min(100,(fail?0:oz)/MAX*100)+"%";
    const frac=R.cs.P?Math.min(1,done/R.cs.P):0,running=!fail&&!paused&&!down&&lastY>0;
    const dug={};order.forEach((c,i)=>{dug[c]=Math.max(0,Math.min(1,frac*order.length-i))*0.9;});
    const digX=order.length?order[0]+(order[order.length-1]-order[0])*frac:undefined;
    const ev=days[Math.max(0,shown-1)]?days[Math.max(0,shown-1)].ev:null,t=realT;
    drawScene(g,G,C,B,U,{mode:"run",R,t,running,prog:frac,dug,digX:B.cut?digX:undefined,
      dozX:B.cut&&order.length?Math.max(Math.min(order[0],order[order.length-1]),Math.min(Math.max(order[0],order[order.length-1]),digX+(order[order.length-1]>order[0]?1:-1))):undefined,
      rain:!paused&&!brk&&ev&&ev.k==="rain",pops,broken:brk?brk.who:null,
      silt:C.silt?Math.min(1,done/Math.max(1,R.siltCap)):0,pile:0.3+0.4*Math.abs(Math.sin(t*0.7)),
      belt:(gg,a,b)=>{if(!running)return;const L=Math.hypot((b.c-a.c)*G.cw,(b.y-a.y)*G.u),gap=14;
        for(let qq=(t*40)%gap;qq<L;qq+=gap){const f=qq/L,x=G.X(a.c+0.5+(b.c-a.c)*f),y=G.Y(a.y+(b.y-a.y)*f)-5;
          gg.fillStyle=(Math.floor(qq/gap)%6===0)?"#ffd84a":"#6b4a2c";gg.strokeStyle="#2a1d10";gg.lineWidth=1;gg.beginPath();gg.arc(x,y,3,0,7);gg.fill();gg.stroke();}}});
    if(brk){const x=G.X(brk.x),yy=G.Y(surf(C,Math.max(0,Math.min(COLS-1,Math.floor(brk.x))))+1.2),pr=0.5+0.5*Math.sin(t*(down?10:6)),R0=G.cw*(0.8+0.15*pr);
      // grace countdown: amber ring drains, then it goes red
      const left=Math.max(0,1-(realT-brk.t0)/GRACE);
      g.lineWidth=3;g.setLineDash([6,4]);g.strokeStyle=down?"rgba(208,69,46,"+(0.55+0.45*pr)+")":"rgba(217,161,43,.35)";
      g.beginPath();g.arc(x,yy,R0,0,7);g.stroke();g.setLineDash([]);
      if(!down){g.strokeStyle="#d9a12b";g.lineWidth=5;g.beginPath();g.arc(x,yy,R0,-Math.PI/2,-Math.PI/2+left*Math.PI*2);g.stroke();}
      if(brk.fixing){g.save();g.translate(x,yy-G.cw*0.2);g.rotate((realT-brk.fixing)*9);g.strokeStyle="#cfc6b4";g.lineWidth=4;g.lineCap="round";
        g.beginPath();g.moveTo(-8,8);g.lineTo(6,-6);g.stroke();g.beginPath();g.arc(7,-7,5,0.8,5.5);g.stroke();g.restore();}}
    mn.draw(mood,t);
    if(!paused&&!finished&&shown>=days.length&&!fail)finish();
  });
}

/* =============== RESULT =============== */
function screenResult(oz,R,fail,ranDay,siltDay,lostDays){
  const C=CLAIMS[S.claim],B=buildFor(C),U=curU(),kit=R.kit;
  const before=bankOz(),starsBefore=totalStars(),st=starsFor(C,oz),won=st>0,prevBest=S.best[C.id]||0;
  if(won&&oz>prevBest)S.best[C.id]=oz;
  if(st>(S.stars[C.id]||0))S.stars[C.id]=st;
  if(st)recordCrewStars(C,st);
  save();syncBar(false);
  const newU=UNLOCKS.filter(u=>before<u.oz&&bankOz()>=u.oz),lim=R.limit;
  const newCrew=CREWS.filter(c=>c.unlock&&starsBefore<c.unlock&&totalStars()>=c.unlock);
  let tip="";
  if(fail)tip=fail;
  else if(R.ranOut&&ranDay)tip="You ran out of pay on day "+ranDay+"! Paint a bigger cut.";
  else if(R.silted&&siltDay)tip="Ponds silted up on day "+siltDay+"! "+(B.wat.length<kit.ponds?"Dig another pond.":"Wash less dirt, catch more gold.");
  else if(lim==="water"&&C.maxFlow&&R.ws.flow>=C.maxFlow-0.01)tip="Your licence caps the water. Squeeze more from every yard!";
  else if(lim==="water"&&R.ws.head>R.ws.reach+1e-6)tip="Water can't climb that high! Plant lower, or water closer.";
  else if(lim==="water")tip="Water's the limit \u2014 a bigger pump, or thriftier kit.";
  else if(lim==="dig")tip=kit.dozer&&!B.dozer?"Muck's slowing the digger — bring the dozer!":"The digger can't dig any faster here.";
  else if(lim==="haul")tip=R.haulKind==="trucks"?(B.trucks<kit.trucks?"Trucks can't keep up — send another!":"Long haul! Move the plant closer to the cut."):"The haul's the limit.";
  else if(lim==="plant")tip="The plant's flat out \u2014 buy more capacity in the yard.";
  if(!fail){if(R.rec<0.7)tip+=" A better sluice would catch more of it.";
    if(st===3)tip="Now THAT'S a plant!";
    if(lostDays)tip+=" Breakdowns cost you "+lostDays+" day"+(lostDays>1?"s":"")+" — fix them faster!";}
  const next=CLAIMS[S.claim+1];
  const nextGate=[2,3,4,5,6].find(ch=>gateOpen(ch))||0;
  const mx=Math.max(R.dig,R.haul===Infinity?0:Math.min(R.haul,250),R.cap,R.water,1);
  const haulIcon=R.haulKind==="trucks"?"truck":R.haulKind==="belt"?"belt":null;
  const rows=[["dig",R.dig,lim==="dig"],[haulIcon,R.haulKind==="pipe"?null:R.haul,lim==="haul"],[R.gear.plant.k,R.cap,lim==="plant"],["wat",R.water,lim==="water"]];
  const verdict=fail?"Nothing reached the plant!":st===3?"MOTHERLODE!":st===2?"Great season!":st===1?"Target made!":fmt(C.s[0]-oz)+" oz short of a star";
  h(`<div class="h1">Season report</div>
     <div class="haul">${ICON.nugget}<b>${fmt(oz)}</b><small>${unit(C)}</small><span class="rst">${starRow(st,"sm")}</span></div>
     <div class="sub center">★ ${C.s[0]} · ★★ ${C.s[1]} · ★★★ ${C.s[2]}</div>
     <div class="crewline"><div id="mnw"></div><div class="bubble ${won?"":"bad"}">${tip}</div></div>
     <div class="gauges card">
       ${rows.filter(r=>r[0]&&r[1]!==null).map(([kd,v,hl])=>`<div class="gr ${hl&&!fail?"hot":""}"><div class="gi" data-k="${kd}"><span>${NAME(kd,C)}</span></div>
         <div class="gb"><i style="width:${Math.min(100,v/mx*100)}%"></i></div><b>${Math.round(v)}</b><small>yd/day</small></div>`).join("")}
       <div class="gr ${R.rec<0.7?"hot":""}"><div class="gi" data-k="sluice"><span>Sluice</span></div>
         <div class="gb"><i style="width:${R.rec*100}%"></i></div><b>${Math.round(R.rec*100)}%</b><small>caught</small></div>
       <div class="gnote2b">${Math.round(R.cs.O)} yd of muck stripped (no gold in it) \u00b7 ${Math.round(R.processed)} yd of pay washed</div>
       ${R.cut>0?`<div class="gnote2b fmcut">Foreman's cut: \u2212${fmt(R.cut)} oz (${R.pct}%)</div>`:""}
       ${R.ranOut&&ranDay?`<div class="gnote hot">Cut dug out on day ${ranDay}</div>`:""}
       ${R.silted&&siltDay?`<div class="gnote hot">Ponds silted up on day ${siltDay}</div>`:""}
     </div>
     ${newU.map(u=>`<div class="card unlock"><span class="tag">UNLOCKED!</span><b>${u.n}</b><div>${u.d}</div></div>`).join("")}
     ${newCrew.map(c=>`<div class="card unlock crewun"><span class="tag">NEW CREW!</span><div class="cu" data-c="${c.id}"></div><b>${c.name}</b><div>${c.boss} \u2014 ${c.pd}</div>
       <div class="sub" style="margin-top:6px">Swap to them any time from the map</div></div>`).join("")}
     ${won?`<button class="btn ghost" id="tweak">${ICON.play}<span>Tweak this build</span></button>`:""}
     ${won&&nextGate?`<button class="btn ghost" id="mini">${ICON.pan}<span>${gateDone(nextGate)?"Prospect again for Chapter "+nextGate:"Prospecting run \u2014 Chapter "+nextGate}</span></button>`:""}
     ${newCrew.length?`<button class="btn ghost" id="meet">${ICON.star}<span>Meet ${newCrew[0].boss}</span></button>`:""}
     <button class="btn ghost" id="map">${ICON.map}<span>Map</span></button>
     <div class="ov" id="ov"><canvas id="fx"></canvas>
       <div class="ovp" id="ovp">
         <div class="ovt ${won?"":"lose"}">${won?"SEASON COMPLETE!":"SEASON SHORT!"}</div>
         <div class="ovs">${[0,1,2].map(i=>`<div class="slot s${i}" id="os${i}">${ICON.star}</div>`).join("")}</div>
         <div class="ovoz">${ICON.nugget}<b id="ovz">0.0</b><small>${unit(C)}</small></div>
         <div class="ovth">${C.s.map((v,i)=>`<span id="th${i}"><i class="op" data-l="${i+1}"></i>${v}</span>`).join("")}</div>
         <div class="ovm"><div id="ovmn"></div><div class="ovmsg" id="ovmsg">&nbsp;</div></div>
         ${newCrew.length?`<div class="ovnew" id="ovnew">${ICON.star}<span>New crew unlocked: <b>${newCrew[0].name}</b></span></div>`:""}
         <div class="ovb" id="ovb">
           <button class="obtn" id="oretry" aria-label="Try again">${ICON.reset}</button>
           <button class="obtn" id="orep" aria-label="Report"><svg viewBox="0 0 24 24" width="26" height="26"><path d="M5 5h14M5 10h14M5 15h9M5 20h6" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg></button>
           ${won?`<button class="obtn go" id="onext" aria-label="Next">${ICON.play}</button>`:`<button class="obtn go" id="onext2" aria-label="Rebuild">${ICON.play}</button>`}
         </div>
       </div></div>`,{cls:"resg",foot:`<div class="row2">
       <button class="btn round" id="re">${ICON.reset}</button>
       ${won?`<button class="btn go big" id="nx">${ICON.play}<span>${next&&claimOpen(S.claim+1)?"NEXT":"MAP"}</span></button>`:`<button class="btn go big" id="re2">${ICON.reset}<span>TRY AGAIN</span></button>`}
     </div>`});
  $$(".gi[data-k]").forEach(el=>el.appendChild(iconCanvas(el.dataset.k,C,40,30)));
  $$(".cu").forEach(el=>{const c=CREWS.find(x=>x.id===el.dataset.c);el.appendChild(minerCanvas(c.look,80,96,"wow"));});
  const mn=addMiner("#mnw",60,76,won?"grin":"worry"),t0=performance.now();
  setTimeout(()=>tutShow("result"),1200);
  const om=minerCanvas(crewOf().look,70,86,"grin");$("#ovmn").appendChild(om);
  $$(".op").forEach(el=>el.appendChild(goldPileCanvas(+el.dataset.l,30,20)));
  // ---- star reveal ----
  const ov=$("#ov"),ovp=$("#ovp"),fx=$("#fx"),d=Math.min(devicePixelRatio||1,2.5);
  fx.width=innerWidth*d;fx.height=innerHeight*d;fx.style.width=innerWidth+"px";fx.style.height=innerHeight+"px";
  const fg=fx.getContext("2d");fg.setTransform(d,0,0,d,0,0);
  const parts=[];let lit=0,done=false,doneAt=0,ovOpen=true;
  const dur=fail?0.6:Math.min(3.2,1.4+st*0.6),target=oz;
  function burst(el,big){const r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
    for(let i=0;i<(big?46:30);i++){const a=Math.random()*Math.PI*2,v=3+Math.random()*(big?9:6);
      parts.push({x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v-3,life:1,s:3+Math.random()*5,c:["#ffd75e","#f5b82e","#fff3b0","#ffffff","#e67e22"][i%5],star:i%4===0});}
    ovp.classList.remove("shake");void ovp.offsetWidth;ovp.classList.add("shake");}
  function closeOv(){ovOpen=false;ov.classList.add("hide");setTimeout(()=>{ov.style.display="none";},250);}
  $("#oretry").onclick=()=>screenBuild();
  $("#orep").onclick=closeOv;
  if($("#onext"))$("#onext").onclick=()=>{if(next&&claimOpen(S.claim+1)){S.claim++;save();screenIntro();}else screenMap();};
  if($("#onext2"))$("#onext2").onclick=()=>screenBuild();
  function star(sp,x,y,r,rot){sp.beginPath();for(let i=0;i<10;i++){const a=rot+i*Math.PI/5,rr=i%2?r*0.45:r;sp.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);}sp.closePath();sp.fill();}
  loop(()=>{const t=(performance.now()-t0)/1000;
    mn.draw(won?(st===3?"wow":"grin"):"worry",t);
    if(!ovOpen)return;
    const p=Math.min(1,Math.max(0,(t-0.5)/dur)),e=1-Math.pow(1-p,2.2),cur=target*e;
    const z=$("#ovz");if(!z)return;z.textContent=fmt(cur);
    while(lit<3&&cur>=C.s[lit]-1e-6&&!fail){const el=$("#os"+lit);el.classList.add("on");$("#th"+lit).classList.add("on");burst(el,lit===2);lit++;}
    if(p>=1&&!done){done=true;doneAt=t;$("#ovmsg").textContent=verdict;$("#ovmsg").classList.add("show");$("#ovb").classList.add("show");if($("#ovnew"))$("#ovnew").classList.add("show");}
    om.draw(done?(won?(st===3?"wow":"grin"):"worry"):(lit?"wow":"grin"),t);
    fg.clearRect(0,0,innerWidth,innerHeight);
    for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.x+=q.vx;q.y+=q.vy;q.vy+=0.28;q.vx*=0.98;q.life-=0.018;
      if(q.life<=0){parts.splice(i,1);continue;}fg.globalAlpha=Math.max(0,q.life);fg.fillStyle=q.c;
      if(q.star)star(fg,q.x,q.y,q.s*1.4,t*4+i);else{fg.beginPath();fg.arc(q.x,q.y,q.s*0.6,0,7);fg.fill();}}
    fg.globalAlpha=1;
    if(done&&st===3&&t-doneAt<2.5&&Math.random()<0.25){const el=$("#os"+Math.floor(Math.random()*3));if(el){const r=el.getBoundingClientRect();
      parts.push({x:r.left+Math.random()*r.width,y:r.top+Math.random()*r.height,vx:(Math.random()-0.5)*2,vy:-2,life:0.8,s:3,c:"#fff",star:true});}}
  });
  $("#re").onclick=()=>{S.builds[C.id]=newBuild(C);save();screenBuild();};
  if($("#re2"))$("#re2").onclick=()=>screenBuild();
  if($("#tweak"))$("#tweak").onclick=()=>screenBuild();
  if($("#nx"))$("#nx").onclick=()=>{if(next&&claimOpen(S.claim+1)){S.claim++;save();screenIntro();}else screenMap();};
  $("#map").onclick=()=>screenMap();
  if($("#meet"))$("#meet").onclick=()=>screenCrew();
  if($("#mini"))$("#mini").onclick=()=>playGate(nextGate);
}

 pan:{n:"Gold Panning",w:"A shovel of creek gravel",

 det:{n:"Metal Detecting",w:"Arid outback, old workings",
   o:"Sweep the coil across the ground. The meter reads the nearest signal \u2014 dig where it peaks. Six holes, and most of what's down there is rubbish."},
 opal:{n:"Opal Cutting",w:"A bucket of ironstone",
   o:"Crack each stone on its seam, then sand down to the colour bar. Stop on the colour and it's a stone \u2014 go through it and it's gravel."},
 dive:{n:"Creek Diving",w:"A deep pool on the bend",

    <div class="card" style="padding:10px 12px;font-size:13px;line-height:1.5">${m.o}</div>

function miniDone(kind,oz,done){

     <div class="card" style="text-align:center;padding:20px">
       <div class="sub">Into the bag</div>
       <div class="big" style="color:${oz>0.5?"var(--gold)":"var(--ink2)"}">${fmt(oz)} oz</div>

/* ---- 1. panning ---- */
function miniPan(finish){
  h(miniHead("pan","<span>Gravel <b id='sg'>0</b></span><span>Gold <b id='sa'>0</b></span><span>Time <b id='sk'>70</b></span>")
    +`<canvas id="cv"></canvas><button class="btn go" id="fin">Tip it out</button>`);
  const cv=$("#cv"),W=Math.min(560,CW()),g=fit(cv,W,W*0.78),H=W*0.78;
  const cx=W/2,cy=H/2,rr=Math.min(cx,cy)-10;
  const P=[];
  for(let i=0;i<78;i++)P.push({a:Math.random()*6.283,d:Math.random()*0.45,g:0,j:Math.random()});
  for(let i=0;i<22;i++)P.push({a:Math.random()*6.283,d:Math.random()*0.35,g:1,j:Math.random()});
  let tilt=0,swirl=0,last=null,t0=Date.now(),over=false;
  cv.addEventListener("pointerdown",e=>{last=e.clientX;cv.setPointerCapture(e.pointerId);});
  cv.addEventListener("pointerup",()=>{last=null;});
  cv.addEventListener("pointercancel",()=>{last=null;});
  cv.addEventListener("pointermove",e=>{
    if(last===null)return;
    const dx=e.clientX-last;last=e.clientX;
    const s=Math.min(1,Math.abs(dx)/26);if(s<0.05)return;
    swirl=Math.max(swirl,s);tilt=Math.max(-1,Math.min(1,dx/30));
    const dir=Math.sign(dx);
    for(let i=P.length-1;i>=0;i--){
      const p=P[i];
      p.a+=dir*s*0.5*(0.7+p.j*0.6);
      p.d+=(p.g?0.06*s-0.2*Math.max(0,s-0.55):-0.05*s)+(Math.random()-0.5)*0.02;
      p.d=Math.max(0,Math.min(1,p.d));
      if(p.d<0.12){
        const lose=p.g?(s>0.6?0.25*s:0):0.17*s;
        if(Math.random()<lose)P.splice(i,1);
      }
    }
  });
  $("#fin").onclick=()=>end();
  function end(){
    if(over)return;over=true;
    if(window.__raf)cancelAnimationFrame(window.__raf);
    const gold=P.filter(p=>p.g).length,grav=P.length-gold;
    const clean=grav<=8?1:grav<=20?0.72:0.45;
    finish(gold*0.26*clean);
  }
  loop(()=>{
    const left=Math.max(0,70-(Date.now()-t0)/1000);
    swirl*=0.9;
    const gold=P.filter(p=>p.g).length,grav=P.length-gold;
    const st=scr.querySelector("#sg");if(!st)return;
    st.textContent=grav;scr.querySelector("#sa").textContent=gold;
    scr.querySelector("#sk").textContent=Math.ceil(left);
    g.clearRect(0,0,W,H);
    g.save();g.translate(cx,cy);g.rotate(tilt*0.13);
    // pan body
    g.fillStyle="#4a4034";g.beginPath();g.ellipse(0,4,rr,rr*0.92,0,0,7);g.fill();
    g.fillStyle="#6b5c46";g.beginPath();g.ellipse(0,0,rr,rr*0.92,0,0,7);g.fill();
    g.fillStyle="#2f2a22";g.beginPath();g.ellipse(0,0,rr*0.9,rr*0.82,0,0,7);g.fill();
    // water
    g.fillStyle="rgba(120,170,190,"+(0.25+swirl*0.25)+")";
    g.beginPath();g.ellipse(tilt*rr*0.13,0,rr*0.84,rr*0.76,0,0,7);g.fill();
    P.forEach(p=>{
      const rad=rr*0.8*(0.14+0.82*(1-p.d));
      const x=Math.cos(p.a)*rad,y=Math.sin(p.a)*rad*0.9;
      if(p.g){g.fillStyle="#f0c150";g.beginPath();g.arc(x,y,2.6,0,7);g.fill();
        g.fillStyle="#fff3c8";g.fillRect(x-0.7,y-0.7,1.4,1.4);}
      else{g.fillStyle=p.j>0.6?"#8d8478":"#5f5a51";g.beginPath();g.arc(x,y,2.1+p.j,0,7);g.fill();}
    });
    g.strokeStyle="#00000055";g.lineWidth=2;g.beginPath();g.ellipse(0,0,rr*0.9,rr*0.82,0,0,7);g.stroke();
    g.restore();
    if(left<=0)end();
  });
}

/* ---- 2. metal detecting ---- */
function miniDet(finish){
  h(miniHead("det","<span>Digs left <b id='sd'>6</b></span><span>Signal <b id='ss'>--</b></span><span>Found <b id='sf'>0.0</b></span>")
    +`<canvas id="cv"></canvas>
      <div class="row"><button class="btn alt" id="fin">Pack up</button>
      <button class="btn go" id="dig">Dig here</button></div>`);
  const cv=$("#cv"),W=Math.min(560,CW()),H=Math.min(340,W*0.95),g=fit(cv,W,H);
  const T=[];
  const mk=(gold,v)=>T.push({x:30+Math.random()*(W-60),y:30+Math.random()*(H-60),gold,v,dug:false});
  mk(1,2.4);mk(1,1.1);mk(1,0.6);mk(1,0.35);
  for(let i=0;i<7;i++)mk(0,0);
  let cxp=W/2,cyp=H/2,digs=6,found=0,over=false,ph=0;
  const move=e=>{const r=cv.getBoundingClientRect();
    cxp=Math.max(12,Math.min(W-12,e.clientX-r.left));cyp=Math.max(12,Math.min(H-12,e.clientY-r.top));};
  cv.addEventListener("pointerdown",e=>{cv.setPointerCapture(e.pointerId);move(e);});
  cv.addEventListener("pointermove",e=>{if(e.buttons||e.pointerType==="touch")move(e);});
  function near(){let best=null,bd=1e9;
    T.forEach(t=>{if(t.dug)return;const d=Math.hypot(t.x-cxp,t.y-cyp);if(d<bd){bd=d;best=t;}});
    return[best,bd];}
  $("#dig").onclick=()=>{
    if(over||digs<=0)return;
    const[t,d]=near();
    if(t&&d<26){t.dug=true;if(t.gold)found+=t.v;}
    else T.push({x:cxp,y:cyp,gold:0,v:0,dug:true});
    digs--;if(digs<=0)setTimeout(end,600);
  };
  $("#fin").onclick=()=>end();
  function end(){if(over)return;over=true;if(window.__raf)cancelAnimationFrame(window.__raf);finish(found);}
  loop(()=>{
    const el=scr.querySelector("#sd");if(!el)return;
    ph+=0.08;
    const[t,d]=near();
    const sig=t?Math.max(0,1-d/130):0;
    el.textContent=digs;
    scr.querySelector("#ss").textContent=sig>0.05?Math.round(sig*100):"--";
    scr.querySelector("#sf").textContent=fmt(found);
    g.fillStyle="#cbb389";g.fillRect(0,0,W,H);
    const r=rnd32(99);
    g.fillStyle="#00000015";for(let i=0;i<260;i++)g.fillRect(r()*W,r()*H,2,2);
    g.fillStyle="#b9a074";for(let i=0;i<22;i++){const x=r()*W,y=r()*H;
      g.beginPath();g.ellipse(x,y,5+r()*9,3+r()*5,r()*3,0,7);g.fill();}
    g.strokeStyle="#a58f68";g.lineWidth=6;g.beginPath();
    for(let x=0;x<=W;x+=6)g.lineTo(x,H*0.35+Math.sin(x/40)*10);g.stroke();
    T.filter(t=>t.dug).forEach(t=>{
      g.fillStyle="#7d6a4a";g.beginPath();g.ellipse(t.x,t.y,11,8,0,0,7);g.fill();
      g.fillStyle="#5c4c34";g.beginPath();g.ellipse(t.x,t.y,7,5,0,0,7);g.fill();
      if(t.gold){g.fillStyle="#f0c150";g.beginPath();g.arc(t.x,t.y,3.4,0,7);g.fill();}
    });
    for(let i=0;i<3;i++){const rad=(18+i*13)+Math.sin(ph-i)*3;
      g.strokeStyle="rgba(200,148,42,"+(0.5-i*0.14)*(0.25+sig)+")";g.lineWidth=2;
      g.beginPath();g.arc(cxp,cyp,rad,0,7);g.stroke();}
    g.strokeStyle="#2b2317";g.lineWidth=3;g.beginPath();g.ellipse(cxp,cyp,17,13,0,0,7);g.stroke();
    g.strokeStyle="#2b2317";g.lineWidth=4;g.beginPath();g.moveTo(cxp,cyp-13);g.lineTo(cxp+14,cyp-44);g.stroke();
    const bw=W-24;
    g.fillStyle="#00000030";g.fillRect(12,H-22,bw,10);
    g.fillStyle=sig>0.72?"#f0c150":sig>0.4?"#c8942a":"#7d6a4a";g.fillRect(12,H-22,bw*sig,10);
    for(let i=1;i<10;i++){g.fillStyle="#00000030";g.fillRect(12+bw*i/10,H-22,1,10);}
  });
}

/* ---- 3. opal ---- */
function miniOpal(finish){
  h(miniHead("opal","<span>Stone <b id='sn'>1</b>/3</span><span>Phase <b id='sp'>crack</b></span><span>Value <b id='sv'>0.0</b></span>")
    +`<canvas id="cv"></canvas><button class="btn go" id="act">Crack it</button>
      <button class="btn alt" id="fin">Sell up</button>`);
  const cv=$("#cv"),W=Math.min(560,CW()),H=Math.min(300,W*0.85),g=fit(cv,W,H);
  let idx=0,val=0,phase="crack",mark=0,dir=1,zone=0.2+Math.random()*0.6,q1=0,
      depth=0,band=0.35+Math.random()*0.4,sanding=false,flash=0,over=false,base=1.4+Math.random()*2;
  const ZW=0.10,BW=0.13;
  const act=$("#act");
  act.onpointerdown=()=>{if(phase==="sand")sanding=true;};
  act.onpointerup=()=>{if(phase==="sand"&&sanding)release();};
  act.onclick=()=>{if(phase==="crack")crack();};
  $("#fin").onclick=()=>end();
  function crack(){
    const d=Math.abs(mark-zone);
    q1=d<ZW?1-(d/ZW)*0.45:0.28;
    phase="sand";depth=0;band=0.3+Math.random()*0.42;flash=1;
    act.textContent="Hold to sand";
  }
  function release(){
    sanding=false;
    let q2;
    if(depth<band)q2=0.35+depth/band*0.25;
    else if(depth<band+BW)q2=1-Math.abs(depth-(band+BW/2))/(BW/2)*0.35;
    else q2=0.12;
    val+=base*q1*q2;flash=1;idx++;
    if(idx>=3){setTimeout(end,700);return;}
    phase="crack";mark=0;dir=1;zone=0.18+Math.random()*0.62;base=1.4+Math.random()*2;
    act.textContent="Crack it";
  }
  function end(){if(over)return;over=true;if(window.__raf)cancelAnimationFrame(window.__raf);finish(val);}
  loop(()=>{
    const el=scr.querySelector("#sn");if(!el)return;
    el.textContent=Math.min(3,idx+1);
    scr.querySelector("#sp").textContent=phase;
    scr.querySelector("#sv").textContent=fmt(val);
    if(phase==="crack"){mark+=dir*0.016;if(mark>1){mark=1;dir=-1;}if(mark<0){mark=0;dir=1;}}
    else if(sanding){depth=Math.min(1,depth+0.006);if(depth>=1)release();}
    flash*=0.94;
    g.fillStyle="#1d1710";g.fillRect(0,0,W,H);
    const sx=W/2,sy=H*0.44,rw=Math.min(W*0.32,100);
    // stone
    g.save();g.translate(sx,sy);
    g.fillStyle="#6a5c48";g.beginPath();
    for(let a=0;a<=6.4;a+=0.25)g.lineTo(Math.cos(a)*rw*(1+0.11*Math.sin(a*3+idx)),
       Math.sin(a)*rw*0.72*(1+0.1*Math.cos(a*4)));
    g.closePath();g.fill();
    if(phase==="sand"||flash>0.05){
      const shown=Math.min(1,depth/Math.max(0.01,band+BW));
      g.save();g.beginPath();g.ellipse(0,0,rw*0.72,rw*0.5,0,0,7);g.clip();
      for(let i=0;i<9;i++){
        const on=depth>band-0.02&&depth<band+BW+0.02;
        g.fillStyle="hsla("+(i*36+idx*40)+",85%,"+(on?62:34)+"%,"+(0.25+shown*0.75)+")";
        g.fillRect(-rw*0.72+i*rw*0.16,-rw*0.5,rw*0.17,rw);
      }
      g.restore();
    }
    g.strokeStyle="#2b2317";g.lineWidth=3;g.beginPath();
    for(let a=0;a<=6.4;a+=0.25)g.lineTo(Math.cos(a)*rw*(1+0.11*Math.sin(a*3+idx)),
       Math.sin(a)*rw*0.72*(1+0.1*Math.cos(a*4)));
    g.closePath();g.stroke();
    g.restore();
    const bx=18,bw=W-36,by=H-40;
    if(phase==="crack"){
      g.fillStyle="#3a3021";g.fillRect(bx,by,bw,16);
      g.fillStyle="#4d7a3a";g.fillRect(bx+bw*(zone-ZW),by,bw*ZW*2,16);
      g.fillStyle="#f0c150";g.fillRect(bx+bw*mark-2,by-5,4,26);
      g.fillStyle="#8a7a5a";g.font="10px ui-monospace,monospace";g.textAlign="left";
      g.fillText("SEAM",bx,by-9);
    }else{
      g.fillStyle="#3a3021";g.fillRect(bx,by,bw,16);
      g.fillStyle="#7a4a8a";g.fillRect(bx+bw*band,by,bw*BW,16);
      g.fillStyle="#f0c150";g.fillRect(bx,by,bw*depth,16);
      g.fillStyle="#8a7a5a";g.font="10px ui-monospace,monospace";g.textAlign="left";
      g.fillText("SANDING DEPTH",bx,by-9);
    }
  });
}

/* ---- 4. creek diving ---- */
function miniDive(finish){
  h(miniHead("dive","<span>Air <b id='sa'>100</b></span><span>Bag <b id='sb'>0.0</b></span><span>Boulders <b id='sr'>0</b></span>")
    +`<canvas id="cv"></canvas><button class="btn go" id="up">Surface with the bag</button>`);
  const cv=$("#cv"),W=Math.min(560,CW()),H=Math.min(330,W*0.95),g=fit(cv,W,H);
  const bed=H-42,B=[],G=[];
  for(let i=0;i<4;i++)B.push({x:W*(0.16+i*0.23),y:bed-16-Math.random()*8,r:20+Math.random()*9,p:0,gone:false});
  let nx=W/2,ny=H/2,down=false,air=100,bag=0,over=false,t=0,removed=0;
  const move=e=>{const r=cv.getBoundingClientRect();
    nx=Math.max(8,Math.min(W-8,e.clientX-r.left));ny=Math.max(8,Math.min(H-8,e.clientY-r.top));};
  cv.addEventListener("pointerdown",e=>{cv.setPointerCapture(e.pointerId);down=true;move(e);});
  cv.addEventListener("pointermove",e=>{if(down)move(e);});
  cv.addEventListener("pointerup",()=>down=false);
  cv.addEventListener("pointercancel",()=>down=false);
  $("#up").onclick=()=>end(1);
  function end(keep){if(over)return;over=true;if(window.__raf)cancelAnimationFrame(window.__raf);
    finish(bag*keep);}
  loop(()=>{
    const el=scr.querySelector("#sa");if(!el)return;
    t+=0.05;air=Math.max(0,air-0.19);
    if(down){
      B.forEach(b=>{if(b.gone)return;
        if(Math.hypot(b.x-nx,b.y-ny)<b.r+6){
          b.p+=0.014;
          if(b.p>=1){b.gone=true;removed++;
            for(let i=0;i<2;i++)G.push({x:b.x+(Math.random()-0.5)*b.r*1.6,y:bed-4-Math.random()*5,
              v:0.25+Math.random()*0.55,s:Math.random()*6});}
        }});
      G.forEach(p=>{if(p.v<=0)return;
        if(Math.hypot(p.x-nx,p.y-ny)<20){const take=Math.min(p.v,0.012);p.v-=take;bag+=take;}});
    }
    el.textContent=Math.ceil(air);
    scr.querySelector("#sb").textContent=fmt(bag);
    scr.querySelector("#sr").textContent=removed+"/4";
    // scene
    const grd=g.createLinearGradient(0,0,0,H);
    grd.addColorStop(0,"#6f97a8");grd.addColorStop(1,"#22414e");
    g.fillStyle=grd;g.fillRect(0,0,W,H);
    g.fillStyle="#ffffff18";
    for(let i=0;i<5;i++){g.fillRect(0,16+i*7+Math.sin(t+i)*3,W,2);}
    g.fillStyle="#2a2620";g.fillRect(0,bed,W,H-bed);
    g.fillStyle="#3a352c";for(let x=0;x<W;x+=14)g.fillRect(x,bed-3+Math.sin(x/9)*2,12,5);
    G.forEach(p=>{if(p.v<=0)return;
      g.fillStyle="#f0c150";
      for(let i=0;i<4;i++){const a=t*1.4+i*1.6+p.s;
        g.globalAlpha=0.5+0.5*Math.sin(a);
        g.beginPath();g.arc(p.x+Math.cos(a)*7,p.y+Math.sin(a*0.7)*4,1.6+p.v*2,0,7);g.fill();}
      g.globalAlpha=1;});
    B.forEach(b=>{if(b.gone)return;
      g.fillStyle="#585047";g.beginPath();
      for(let a=0;a<=6.4;a+=0.5)g.lineTo(b.x+Math.cos(a)*b.r*(1+0.13*Math.sin(a*3+b.r)),
        b.y+Math.sin(a)*b.r*0.82);
      g.closePath();g.fill();
      g.strokeStyle="#332f29";g.lineWidth=2;g.stroke();
      if(b.p>0){g.strokeStyle="#f0c150";g.lineWidth=3;g.beginPath();
        g.arc(b.x,b.y,b.r+6,-1.57,-1.57+6.28*b.p);g.stroke();}
    });
    // nozzle
    g.strokeStyle="#c8c0ae";g.lineWidth=3;g.beginPath();g.moveTo(nx,ny);
    g.bezierCurveTo(nx+30,ny-40,W-30,60,W-16,10);g.stroke();
    g.fillStyle=down?"#f0c150":"#c8c0ae";g.beginPath();g.arc(nx,ny,9,0,7);g.fill();
    g.strokeStyle="#2b2317";g.lineWidth=2;g.stroke();
    if(down){g.strokeStyle="#ffffff55";g.lineWidth=1.5;
      g.beginPath();g.arc(nx,ny,14+Math.sin(t*4)*3,0,7);g.stroke();}
    // air bar
    g.fillStyle="#00000044";g.fillRect(10,10,W-20,9);
    g.fillStyle=air>30?"#9fd6e8":"#d97a5a";g.fillRect(10,10,(W-20)*air/100,9);
    if(air<=0)end(0.5);
  });
}
